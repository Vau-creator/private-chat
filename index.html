<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }
    header {
      background: #1769ff;
      color: white;
      padding: 18px;
      font-size: 21px;
      font-weight: bold;
    }
    #status {
      font-size: 13px;
      font-weight: normal;
      margin-top: 5px;
    }
    #messages {
      height: calc(100dvh - 150px);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 17px;
      max-width: 82%;
      background: white;
      overflow-wrap: anywhere;
    }
    .mine {
      background: #1769ff;
      color: white;
      align-self: flex-end;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 24px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 24px;
      padding: 12px 18px;
      background: #1769ff;
      color: white;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    Private Chat
    <div id="status">চ্যাটে স্বাগতম</div>
  </header>

  <main id="messages">
    <div class="msg">স্বাগতম! এখানে আপনার চ্যাটের ডিজাইন তৈরি হবে।</div>
  </main>

  <form id="chatForm">
    <input id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('messageInput');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const bubble = document.createElement('div');
      bubble.className = 'msg mine';
      bubble.textContent = text;
      messages.appendChild(bubble);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
