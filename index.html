<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f7;font-family:Arial,sans-serif}
header{background:#075e54;color:white;padding:16px;font-size:21px;text-align:center}
main{max-width:650px;margin:auto;padding:12px}
button{background:#087e6b;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:16px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#messages{height:55vh;overflow:auto;background:white;padding:12px;border-radius:10px;margin:12px 0}
.msg{background:#dcf8c6;padding:10px;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}
.adminmsg{background:#dce9ff}
.msg img{max-width:100%;border-radius:8px}
.msg audio{width:100%;max-width:280px}
.small{font-size:12px;color:#555}
#chat{display:none}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
#photo{display:none}
a{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>Private Chat</header>
<main>
<div id="login" style="display:none">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin email">
<br><br>
<input id="password" type="password" placeholder="Password">
<br><br>
<button id="loginBtn">Login</button>
<p id="error"></p>
</div>

<div id="dashboard" style="display:none">
<h3>নতুন চ্যাট লিংক তৈরি করুন</h3>
<button id="createBtn">নতুন লিংক তৈরি</button>
<p id="link"></p>
<hr>
<h3>চ্যাট খুলুন</h3>
<input id="roomInput" placeholder="Room ID">
<br><br>
<button id="openRoom">চ্যাট খুলুন</button>
</div>

<div id="chat">
<p id="roomLabel"></p>
<div id="messages"></div>
<form id="sendForm" class="row">
<input id="messageInput" placeholder="মেসেজ লিখুন..." maxlength="2000" autocomplete="off">
<button type="submit" id="sendBtn">Send</button>
</form>
<br>
<div class="row">
<button id="imageBtn" type="button">ছবি পাঠান</button>
<button id="voiceBtn" type="button">ভয়েস রেকর্ড</button>
</div>
<input id="photo" type="file" accept="image/*">
<p id="status"></p>
<button id="backBtn" style="display:none">Admin প্যানেলে ফিরুন</button>
</div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getAuth, signInAnonymously, signInWithEmailAndPassword,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
 getFirestore, collection, addDoc, doc, setDoc, getDoc,
 onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDkYVvqxpGUcmsAJvK6ofIyNgn6-XZTin4",
 authDomain: "private-chat-798f6.firebaseapp.com",
 projectId: "private-chat-798f6",
 storageBucket: "private-chat-798f6.firebasestorage.app",
 messagingSenderId: "598670362336",
 appId: "1:598670362336:web:35e7595356620d48cc7285",
 measurementId: "G-F0S5M7N18D"
};

const ADMIN_UID = "NBF2IXHvSiZSzIuvLBIhEdDpnNo2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const adminMode = params.get("admin") === "1";
let roomId = params.get("room");
let isAdmin = false;
let stopMessages = null;
let recorder = null;
let audioChunks = [];

const $ = id => document.getElementById(id);

function show(id, yes=true) {
 $(id).style.display = yes ? "block" : "none";
}

function safeText(value) {
 return String(value ?? "");
}

function roomUrl(id, admin=false) {
 return location.origin + location.pathname +
  (admin ? "?admin=1&room=" : "?room=") + encodeURIComponent(id);
}

$("loginBtn").onclick = async () => {
 $("error").textContent = "";
 try {
  await signInWithEmailAndPassword(
   auth, $("email").value.trim(), $("password").value
  );
 } catch(e) {
  $("error").textContent = "Login হয়নি: " + e.message;
 }
};

$("createBtn").onclick = async () => {
 if (!isAdmin) return;
 try {
  const id = crypto.randomUUID().replaceAll("-", "").slice(0,20);
  await setDoc(doc(db,"chats",id), {
   active:true,
   createdAt:serverTimestamp()
  });
  $("link").innerHTML = "";
  const p = document.createElement("p");
  p.textContent = "Guest লিংক: ";
  const a = document.createElement("a");
  a.href = roomUrl(id);
  a.textContent = roomUrl(id);
  a.target = "_blank";
  p.appendChild(a);
  $("link").appendChild(p);

  const copy = document.createElement("button");
  copy.textContent = "লিংক কপি";
  copy.onclick = async () => {
   await navigator.clipboard.writeText(roomUrl(id));
   copy.textContent = "কপি হয়েছে";
  };
  $("link").appendChild(copy);

  $("roomInput").value = id;
 } catch(e) {
  alert("লিংক তৈরি হয়নি: " + e.message);
 }
};

$("openRoom").onclick = () => {
 const id = $("roomInput").value.trim();
 if (id) location.href = roomUrl(id, true);
};

$("backBtn").onclick = () => location.href = "?admin=1";

onAuthStateChanged(auth, async user => {
 if (!user) {
  if (adminMode) show("login");
  else {
   try { await signInAnonymously(auth); }
   catch(e) { $("status").textContent = e.message; }
  }
  return;
 }

 isAdmin = user.uid === ADMIN_UID;

 if (adminMode && !isAdmin) {
  show("login");
  $("error").textContent = "এই অ্যাকাউন্ট Admin নয়।";
  return;
 }

 if (adminMode && !roomId) {
  show("login",false);
  show("dashboard");
  show("chat",false);
  return;
 }

 if (!adminMode && !roomId) {
  show("login",false);
  show("dashboard",false);
  $("status").textContent = "চ্যাট লিংক সঠিক নয়।";
  return;
 }

 show("login",false);
 show("dashboard",false);
 show("chat");

 $("roomLabel").textContent = "Room ID: " + roomId;
 show("backBtn",isAdmin);

 try {
  const roomSnap = await getDoc(doc(db,"chats",roomId));
  if (!roomSnap.exists() || roomSnap.data().active !== true) {
   $("status").textContent = "এই চ্যাট লিংক বন্ধ অথবা ভুল।";
   $("sendBtn").disabled = true;
   return;
  }
  startMessages();
 } catch(e) {
  $("status").textContent = "চ্যাট খুলতে সমস্যা: " + e.message;
 }
});

function startMessages() {
 if (stopMessages) stopMessages();

 const q = query(
  collection(db,"chats",roomId,"messages"),
  orderBy("createdAt","asc")
 );

 stopMessages = onSnapshot(q, snapshot => {
  $("messages").innerHTML = "";

  snapshot.forEach(item => {
   const m = item.data();
   const box = document.createElement("div");
   box.className = "msg " +
    (m.sender === "admin" ? "adminmsg" : "");

   const who = document.createElement("div");
   who.className = "small";
   who.textContent = m.sender === "admin" ? "Admin" : "Guest";
   box.appendChild(who);

   if (m.type === "image" && m.mediaData) {
    const img = document.createElement("img");
    img.src = m.mediaData;
    img.alt = "ছবি";
    box.appendChild(img);
   } else if (m.type === "audio" && m.mediaData) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = m.mediaData;
    box.appendChild(audio);
   } else {
    const text = document.createElement("div");
    text.textContent = safeText(m.text);
    box.appendChild(text);
   }

   $("messages").appendChild(box);
  });

  $("messages").scrollTop = $("messages").scrollHeight;
 }, e => {
  $("status").textContent = "মেসেজ লোড হয়নি: " + e.message;
 });
}

async function sendMessage(data) {
 if (!auth.currentUser || !roomId) return;

 $("status").textContent = "পাঠানো হচ্ছে...";
 try {
  await addDoc(collection(db,"chats",roomId,"messages"), {
   ...data,
   sender: isAdmin ? "admin" : "guest",
   createdAt:serverTimestamp()
  });
  $("status").textContent = "";
 } catch(e) {
  $("status").textContent = "পাঠানো যায়নি: " + e.message;
 }
}

$("sendForm").onsubmit = async e => {
 e.preventDefault();
 const text = $("messageInput").value.trim();
 if (!text) return;
 $("sendBtn").disabled = true;
 await sendMessage({type:"text",text});
 $("messageInput").value = "";
 $("sendBtn").disabled = false;
};

$("imageBtn").onclick = () => $("photo").click();

$("photo").onchange = async e => {
 const file = e.target.files[0];
 if (!file) return;

 if (!file.type.startsWith("image/")) {
  $("status").textContent = "ছবির ফাইল নির্বাচন করুন।";
  return;
 }

 $("status").textContent = "ছবি প্রস্তুত হচ্ছে...";

 try {
  const data = await new Promise((resolve,reject) => {
   const img = new Image();
   const url = URL.createObjectURL(file);

   img.onload = () => {
    let w = img.width, h = img.height;
    const max = 640;
    if (w > max || h > max) {
     const scale = max / Math.max(w,h);
     w = Math.round(w*scale);
     h = Math.round(h*scale);
    }

    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    resolve(canvas.toDataURL("image/jpeg",0.55));
   };

   img.onerror = () => {
    URL.revokeObjectURL(url);
    reject(new Error("ছবি খোলা যায়নি"));
   };
   img.src = url;
  });

  if (data.length > 450000) {
   throw new Error("ছবিটি বড়। ছোট ছবি দিন।");
  }

  await sendMessage({type:"image",mediaData:data,mimeType:"image/jpeg"});
 } catch(e) {
  $("status").textContent = e.message;
 }

 e.target.value = "";
};

$("voiceBtn").onclick = async () => {
 if (recorder && recorder.state === "recording") {
  recorder.stop();
  $("voiceBtn").textContent = "ভয়েস রেকর্ড";
  return;
 }

 if (!navigator.mediaDevices?.getUserMedia ||
     !window.MediaRecorder) {
  $("status").textContent = "এই ব্রাউজারে ভয়েস রেকর্ডিং সাপোর্ট নেই।";
  return;
 }

 try {
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioChunks = [];

  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
   ? "audio/webm;codecs=opus"
   : "";

  recorder = new MediaRecorder(stream,mime ? {mimeType:mime} : {});
  recorder.ondataavailable = e => {
   if (e.data.size) audioChunks.push(e.data);
  };

  recorder.onstop = async () => {
   stream.getTracks().forEach(t => t.stop());

   const blob = new Blob(audioChunks,{type:recorder.mimeType || "audio/webm"});

   if (blob.size > 250000) {
    $("status").textContent = "ভয়েস বড় হয়েছে। ১০ সেকেন্ডের মধ্যে রেকর্ড করুন।";
    return;
   }

   const reader = new FileReader();
   reader.onload = async () => {
    await sendMessage({
     type:"audio",
     mediaData:reader.result,
     mimeType:blob.type
    });
   };
   reader.readAsDataURL(blob);
  };

  recorder.start();
  $("voiceBtn").textContent = "রেকর্ড বন্ধ করুন";
  $("status").textContent = "সর্বোচ্চ ১০ সেকেন্ড রেকর্ড করুন।";

  setTimeout(() => {
   if (recorder && recorder.state === "recording") {
    recorder.stop();
    $("voiceBtn").textContent = "ভয়েস রেকর্ড";
   }
  },10000);

 } catch(e) {
  $("status").textContent = "মাইক্রোফোন অনুমতি দিন: " + e.message;
 }
};
</script>
</body>
</html>
